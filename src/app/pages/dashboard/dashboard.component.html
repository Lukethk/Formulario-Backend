<div class="space-y-6">
  <!-- Título -->
  <div class="text-center">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Dashboard</h1>
    <p class="text-gray-600">Bienvenido al sistema de gestión de formularios de bomberos</p>
  </div>

  <!-- Estadísticas -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Brigadas -->
    <div class="card">
      <div class="flex items-center">
        <div class="p-3 rounded-full bg-primary-100 text-primary-600">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
        </div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-600">Brigadas</p>
          <p class="text-2xl font-semibold text-gray-900">{{ stats.brigadas }}</p>
        </div>
      </div>
    </div>

    <!-- Equipos -->
    <div class="card">
      <div class="flex items-center">
        <div class="p-3 rounded-full bg-fire-100 text-fire-600">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
        </div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-600">Equipos</p>
          <p class="text-2xl font-semibold text-gray-900">{{ stats.equipos }}</p>
        </div>
      </div>
    </div>

    <!-- Categorías -->
    <div class="card">
      <div class="flex items-center">
        <div class="p-3 rounded-full bg-green-100 text-green-600">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
          </svg>
        </div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-600">Categorías</p>
          <p class="text-2xl font-semibold text-gray-900">{{ stats.categorias }}</p>
        </div>
      </div>
    </div>

    <!-- Tallas -->
    <div class="card">
      <div class="flex items-center">
        <div class="p-3 rounded-full bg-purple-100 text-purple-600">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-600">Tallas</p>
          <p class="text-2xl font-semibold text-gray-900">{{ stats.tallas }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Acciones rápidas -->
  <div class="card">
    <h2 class="text-xl font-semibold text-gray-900 mb-4">Acciones Rápidas</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <a routerLink="/brigadas" class="btn-primary text-center">
        Nueva Brigada
      </a>
      <a routerLink="/equipos" class="btn-primary text-center">
        Nuevo Equipo
      </a>
      <a routerLink="/categorias" class="btn-primary text-center">
        Nueva Categoría
      </a>
      <a routerLink="/tallas" class="btn-primary text-center">
        Nueva Talla
      </a>
    </div>
  </div>
</div>
