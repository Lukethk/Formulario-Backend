<header class="bg-white shadow-sm border-b border-gray-200">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center py-4">
      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-fire-600 rounded-lg flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"></path>
          </svg>
        </div>
        <h1 class="text-xl font-bold text-gray-900">Formulario de Bomberos</h1>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex space-x-8">
        <a routerLink="/dashboard" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200">
          Dashboard
        </a>
        <a routerLink="/brigadas" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200">
          Brigadas
        </a>
        <a routerLink="/equipos" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200">
          Equipos
        </a>
        <a routerLink="/categorias" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200">
          Categorías
        </a>
        <a routerLink="/tallas" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200">
          Tallas
        </a>
      </nav>

      <!-- Mobile menu button -->
      <button 
        class="md:hidden p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-500"
        (click)="toggleMenu()"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <div *ngIf="isMenuOpen" class="md:hidden py-4 border-t border-gray-200">
      <nav class="flex flex-col space-y-3">
        <a routerLink="/dashboard" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200 py-2">
          Dashboard
        </a>
        <a routerLink="/brigadas" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200 py-2">
          Brigadas
        </a>
        <a routerLink="/equipos" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200 py-2">
          Equipos
        </a>
        <a routerLink="/categorias" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200 py-2">
          Categorías
        </a>
        <a routerLink="/tallas" routerLinkActive="text-primary-600" class="text-gray-600 hover:text-primary-600 transition-colors duration-200 py-2">
          Tallas
        </a>
      </nav>
    </div>
  </div>
</header>
